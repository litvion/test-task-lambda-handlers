AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Notification handler Lambda (Node.js + TypeScript)

Resources:
  NotificationHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          LOG_LEVEL: INFO
          CREATED_BY_TYPE: '0'
          CREATED_BY_ID: '0'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: node22
        Minify: true
        Sourcemap: true
        EntryPoints: ['src/handler.ts']

Outputs:
  FunctionName:
    Value: !Ref NotificationHandlerFunction
